<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | LabTrack – Grupo 5</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="d-flex align-items-center">
  <main class="container" id="contenido">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-9 col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 text-center lt-marca mb-1" id="titulo" data-testid="titulo">LabTrack</h1>
            <p class="text-center text-muted mb-4">Préstamo de equipos de laboratorio</p>

            <div id="alerta-seguridad" data-testid="alerta-seguridad" class="d-none" role="alert"></div>
            <div id="mensaje" data-testid="mensaje" class="d-none" role="alert" aria-live="polite"></div>

            <form id="form-login" data-testid="form-login" novalidate>
              <div class="mb-3">
                <label for="codigo" class="form-label">Código de estudiante</label>
                <input type="text" class="form-control" id="codigo" name="codigo" data-testid="codigo"
                       autocomplete="username" maxlength="20" required autofocus>
              </div>
              <div class="mb-4">
                <label for="clave" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="clave" name="clave" data-testid="clave"
                       autocomplete="current-password" maxlength="64" required>
              </div>
              <button type="submit" class="btn btn-primary w-100" id="btn-ingresar" data-testid="btn-ingresar">
                Ingresar
              </button>
            </form>
          </div>
        </div>
        <p class="text-center text-muted small mt-3">Calidad y Pruebas de Software – UPN · Grupo 5</p>
      </div>
    </div>
  </main>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
