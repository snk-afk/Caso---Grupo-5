<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis reservas | LabTrack – Grupo 5</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <nav class="navbar navbar-dark lt-navbar mb-4" id="barra-navegacion" data-testid="barra-navegacion"></nav>
  <main class="container pb-5" id="contenido" hidden>
    <h1 class="h3 mb-3" id="titulo" data-testid="titulo">Mis reservas</h1>

    <div class="alert alert-danger" id="aviso-estado" data-testid="aviso-estado" hidden>
      Tu cuenta está penalizada por una devolución tardía. No puedes reservar equipos hasta que el encargado retire la penalización.
    </div>

    <div id="mensaje" data-testid="mensaje" class="d-none" role="alert" aria-live="polite"></div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 card-title">Nueva reserva</h2>
        <form id="form-reserva" data-testid="form-reserva" class="row g-3" novalidate>
          <div class="col-12 col-lg-5">
            <label for="equipo" class="form-label">Equipo</label>
            <select class="form-select" id="equipo" name="equipo" data-testid="equipo" required>
              <option value="">Cargando equipos...</option>
            </select>
          </div>
          <div class="col-12 col-sm-4 col-lg-3">
            <label for="fecha" class="form-label">Fecha</label>
            <input type="date" class="form-control" id="fecha" name="fecha" data-testid="fecha" required>
          </div>
          <div class="col-6 col-sm-4 col-lg-2">
            <label for="hora-inicio" class="form-label">Hora de inicio</label>
            <input type="time" class="form-control" id="hora-inicio" name="horaInicio" data-testid="hora-inicio" required>
          </div>
          <div class="col-6 col-sm-4 col-lg-2">
            <label for="hora-fin" class="form-label">Hora de fin</label>
            <input type="time" class="form-control" id="hora-fin" name="horaFin" data-testid="hora-fin" required>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary" id="btn-reservar" data-testid="btn-reservar">Reservar</button>
          </div>
        </form>
      </div>
    </div>

    <h2 class="h5">Historial de reservas</h2>
    <div class="table-responsive bg-white rounded shadow-sm">
      <table class="table align-middle mb-0" id="tabla-reservas" data-testid="tabla-reservas">
        <thead class="table-light">
          <tr>
            <th scope="col">Equipo</th>
            <th scope="col">Fecha</th>
            <th scope="col">Horario</th>
            <th scope="col">Estado</th>
            <th scope="col">Motivo de rechazo</th>
          </tr>
        </thead>
        <tbody id="cuerpo-reservas" data-testid="cuerpo-reservas"></tbody>
      </table>
      <p class="text-muted p-3 mb-0" id="sin-reservas" data-testid="sin-reservas" hidden>Todavía no tienes reservas.</p>
    </div>
  </main>
  <script type="module" src="js/pages/reservas.js"></script>
</body>
</html>
