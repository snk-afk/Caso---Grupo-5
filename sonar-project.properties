# Configuración de SonarQube / SonarScanner para LabTrack – Grupo 5
sonar.projectKey=labtrack-grupo5
sonar.projectName=LabTrack - Grupo 5
sonar.projectVersion=1.0.0

# Código fuente analizado: frontend (public/js) y scripts de datos semilla
sonar.sources=public/js,scripts
sonar.sourceEncoding=UTF-8

# Excluir dependencias, configuración local de Firebase y archivos generados
sonar.exclusions=**/node_modules/**,public/js/firebase-config.js,public/js/firebase-config.example.js,public/js/firebase-config.emulador.js,coverage/**,jmeter/**

# El proyecto no incluye pruebas automatizadas ni reporte de cobertura
# (las pruebas las ejecuta el equipo de forma manual / con sus propias herramientas).
sonar.coverage.exclusions=**/*
